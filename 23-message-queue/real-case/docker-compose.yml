# Kafka (KRaft, single-node) untuk real-case message queue.
#   docker compose up -d
#   # tunggu ~15 dtk broker siap, lalu:
#   KAFKA_BROKERS=127.0.0.1:9092 go run ./23-message-queue/real-case
#
# Alternatif RabbitMQ: kode repo mendukung amqp091 (lihat integration_test.go);
# tinggal set RABBITMQ_URL. Di sini contoh Kafka.
services:
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
