# Redis untuk antrean job durable.
#   docker compose up -d
#   REDIS_ADDR=127.0.0.1:6379 go run ./25-background-jobs/real-case
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
