# Infra untuk real-case CQRS: MySQL (write model) + Elasticsearch (read model).
#
#   docker compose up -d
#   # tunggu ES sehat (~20-30 dtk), lalu:
#   MYSQL_DSN='root:secret@tcp(127.0.0.1:3306)/esdemo?parseTime=true' \
#   ES_URL='http://127.0.0.1:9200' \
#   go run ./45-event-sourcing-cqrs/real-case/mysql-elasticsearch
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: esdemo
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-psecret"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
