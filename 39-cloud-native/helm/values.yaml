# Nilai default — bisa di-override per environment: helm install -f values-prod.yaml
replicaCount: 3

image:
  repository: ghcr.io/user/goapp
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

env:
  PORT: "8080"
