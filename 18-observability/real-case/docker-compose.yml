# Prometheus untuk men-scrape /metrics aplikasi.
# Jalankan app pada :2112 (ganti httptest -> http.ListenAndServe(":2112", mux)),
# lalu:
#   docker compose up -d
#   buka http://localhost:9090  (query: rate(http_requests_total[1m]))
services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
